<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's Online · The Lands of Dusk</title>
<meta name="description" content="Who's playing Dusk right now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* The website's own look (~/DuskRPG/web/*.html): stone, gold, parchment. */
  :root {
    --stone-dark: #2e2e30;
    --stone-mid: #45464a;
    --stone-light: #a9abb2;
    --sapphire: #1a2f5c;
    --sapphire-bright: #3a5ba0;
    --gold: #cbb26a;
    --gold-bright: #e8d391;
    --parchment: #d8d2c0;
    --ember: #b5432f;
    --emerald: #2e6b4f;
    --emerald-bright: #4caf7d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background-color: var(--stone-dark);
    background-image: url('/images/bgTile.jpg');
    background-repeat: repeat;
    color: var(--parchment);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 18px; line-height: 1.5;
  }
  a { color: var(--gold-bright); text-decoration: none; border-bottom: 1px dotted transparent; }
  a:hover { border-bottom-color: var(--gold-bright); }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; }
  .header { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0 6px; }
  .header img { height: 60px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
  .header img.dragon { height: 78px; transform: scaleX(-1); }
  h1.title { font-family: 'Cinzel', serif; font-weight: 700; font-size: 44px; letter-spacing: 0.04em; margin: 0; color: var(--gold-bright);
    text-shadow: 0 0 10px rgba(203,178,106,0.35), 2px 2px 0 #1a1a1a, -1px -1px 0 #1a1a1a; }
  .tagline { text-align: center; font-style: italic; color: var(--stone-light); margin: 0 0 24px; font-size: 15px; }
  .columns { display: grid; grid-template-columns: 230px 1fr; gap: 22px; align-items: start; }
  .panel { position: relative; border-image: url('/images/bgframe.jpg') 40 fill stretch; border-image-width: 40px; border-style: solid; border-width: 40px;
    background-color: rgba(20,20,22,0.55); padding: 4px 20px 20px; margin-bottom: 22px; min-width: 0; }
  .panel h2 { font-family: 'Cinzel', serif; font-size: 19px; letter-spacing: 0.03em; color: var(--gold); border-bottom: 1px solid rgba(203,178,106,0.3); padding-bottom: 8px; margin: 14px 0 14px; }
  .nav-list { list-style: none; margin: 0; padding: 0; }
  .nav-list li { margin-bottom: 10px; }
  .nav-list a { font-size: 16px; }
  .nav-list a.here { color: var(--parchment); border-bottom-color: var(--gold); }
  .play-btn { display: flex; align-items: center; justify-content: center; margin-top: 6px; padding: 12px 8px; width: 100%;
    background: linear-gradient(#4b4c51, #2c2d31); border: 1px solid var(--gold); border-radius: 4px;
    color: var(--gold-bright); font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: 0.05em; text-shadow: 0 1px 3px rgba(0,0,0,0.8); box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
  .play-btn:hover { filter: brightness(1.15); border-bottom-color: var(--gold); }
  .desc { color: var(--stone-light); font-size: 15px; }

  /* Who's online (main panel). */
  .who .sub { color: var(--stone-light); font-size: 15px; font-style: italic; margin: 0 0 10px; }
  .who .count { font-size: 17px; margin: 0 0 12px; color: var(--gold-bright); }
  .who ul { list-style: none; margin: 0; padding: 0; }
  .who li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 10px; border-top: 1px solid rgba(203,178,106,0.18); }
  .who li:first-child { border-top: 1px solid rgba(203,178,106,0.35); }
  .who li:hover { background: rgba(203,178,106,0.04); }
  .who .name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px; }
  .who .title { color: var(--stone-light); font-style: italic; }
  .who .clan { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #cfdcff;
    border: 1px solid var(--sapphire-bright); background: rgba(58,91,160,0.25); border-radius: 3px; padding: 0 6px; white-space: nowrap; }
  .who .race { margin-left: auto; color: var(--stone-light); font-size: 15px; text-transform: capitalize; white-space: nowrap; }
  .who .god { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.05em; padding: 0 6px; border-radius: 3px;
    background: rgba(203,178,106,0.2); border: 1px solid var(--gold); color: var(--gold-bright); }
  .who .for { color: var(--stone-light); font-size: 14px; white-space: nowrap; }
  .who .empty { display: block; padding: 24px 16px; color: var(--stone-light); text-align: center; font-style: italic; }
  .who .foot { margin: 14px 0 0; color: var(--stone-light); font-size: 14px; font-style: italic; }
  @media (max-width: 760px) {
    .columns { grid-template-columns: 1fr; }
    .main { order: -1; } /* who's online first, then the links */
    h1.title { font-size: 34px; }
    .header img { height: 44px; }
    .header img.dragon { height: 56px; }
  }
  .site-note { margin: 28px 0 0; text-align: center; font-size: 13px; color: var(--stone-light); }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img class="knight" src="/images/knight.gif" alt="">
    <h1 class="title">The Lands of Dusk</h1>
    <img class="dragon" src="/images/dragon.gif" alt="">
  </div>
  <p class="tagline">Who is out in the world of Dusk right now.</p>

  <div class="columns">
    <div class="sidebar">
      <div class="panel">
        <h2>Links</h2>
        <ul class="nav-list">
          <li><a href="/web/index.html">Home</a></li>
          <li><a href="/web/howtoplay.html">How to Play</a></li>
          <li><a href="/web/javaclient.html">Java Client</a></li>
          <li><a href="/web/faq.html">FAQ</a></li>
          <li><a href="forum.html">Forum</a></li>
          <li><a href="leaderboard.html">Leaderboard</a></li>
          <li><a href="who.html" class="here">Who's Online</a></li>
          <li><a href="/web/credits.html">Credits</a></li>
        </ul>
        <a class="play-btn" href="./">Play Now</a>
      </div>
    </div>
    <div class="main">
      <div class="panel">
        <main class="who">
          <h2>Who's Online</h2>
          <p class="sub">Players in the world of Dusk right now.</p>
          <p class="count" id="count" aria-live="polite">Looking…</p>
          <ul id="list" aria-label="Players online"></ul>
          <p class="foot" id="updated"></p>
        </main>
      </div>
    </div>
  </div>
  <p class="site-note">Nothing we collect is ever sold or shared.</p>
</div>
  <script type="module">
    import { describeWho } from './js/who.js';
    const $ = (id) => document.getElementById(id);
    async function refresh() {
      let data = null;
      try {
        const r = await fetch('who.json', { cache: 'no-store' });
        if (r.ok) data = await r.json();
      } catch {}
      const w = describeWho(data, Date.now());
      $('count').textContent = w.count;
      $('updated').textContent = w.updated;
      $('list').replaceChildren(...(w.rows.length ? w.rows.map((p) => {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.className = 'name';
        name.append(Object.assign(document.createElement('a'), { href: `profile.html?name=${encodeURIComponent(p.name)}`, textContent: p.name }));
        li.append(name);
        if (p.god) li.append(Object.assign(document.createElement('span'), { className: 'god', textContent: 'God' }));
        if (p.title) li.append(Object.assign(document.createElement('span'), { className: 'title', textContent: p.title }));
        if (p.clan) li.append(Object.assign(document.createElement('span'), { className: 'clan', textContent: p.clan, title: 'Clan' }));
        li.append(Object.assign(document.createElement('span'), { className: 'race', textContent: p.race }));
        if (p.online) li.append(Object.assign(document.createElement('span'), { className: 'for', textContent: p.online }));
        return li;
      }) : [Object.assign(document.createElement('li'), { className: 'empty', textContent: w.empty })]));
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
