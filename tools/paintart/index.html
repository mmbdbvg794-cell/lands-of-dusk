<!doctype html>
<meta charset="utf-8">
<title>Paint art</title>
<!-- Generates the Painted sheets from the server's originals (next to this
     page): map.gif via painter.js, characters drawn fresh by people.js (one
     look per players.gif image), creatures and items via figures.js.
     Each result is left in <pre id="<name>"> as a data: URL for the caller. -->
<body style="background:#222">
<script type="module">
  import { paintSheet } from './painter.js';
  import { paintFigureSheet } from './figures.js';
  import { paintPeopleSheet } from './people.js';
  import { paintCreatures } from './creatures.js';
  const load = (src) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
  const out = (name, canvas) => {
    const pre = document.createElement('pre');
    pre.id = name;
    pre.textContent = canvas.toDataURL('image/png');
    document.body.append(pre);
  };
  out('map', paintSheet(await load('map.gif')));
  const players = await load('players.gif');
  out('players', paintPeopleSheet(Math.round(players.naturalWidth / players.naturalHeight / 8)));
  // Creatures with a painter are drawn fresh; the rest keep the filter.
  out('sprites', paintCreatures(paintFigureSheet(await load('sprites.gif'))));
  const done = document.createElement('pre');
  done.id = 'done';
  document.body.append(done);
</script>
</body>
