<!doctype html>
<meta charset="utf-8">
<title>Paint art</title>
<!-- Generates the Painted sheets from the server's originals (next to this
     page): map.gif via painter.js, characters drawn fresh by figure.js (one
     look per players.gif image), creatures and items via figures.js.
     Each result is left in <pre id="<name>"> as a data: URL for the caller. -->
<body style="background:#222">
<script type="module">
  import { paintSheet } from './painter.js';
  import { paintFigureSheet } from './figures.js';
  import { paintPeopleSheet } from './figure.js';
  import { paintCreatures } from './creatures.js';
  import { paintNamedSheet } from './bestiary.js';
  import { paintItemSheet } from './items.js';
  const load = (src) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
  const out = (name, canvas) => {
    const pre = document.createElement('pre');
    pre.id = name;
    pre.textContent = canvas.toDataURL('image/png');
    document.body.append(pre);
  };
  out('map', paintSheet(await load('map.gif')));
  const players = await load('players.gif');
  out('players', paintPeopleSheet(Math.round(players.naturalWidth / players.naturalHeight / 8)));
  // Creatures with a painter are drawn fresh; the rest keep the filter.
  out('sprites', paintCreatures(paintFigureSheet(await load('sprites.gif'))));
  // Creatures by name (mobnames.json: the server's defMobs names).
  const named = paintNamedSheet(await (await fetch('mobnames.json')).json());
  out('named', named.sheet);
  const idx = document.createElement('pre');
  idx.id = 'namedIndex';
  idx.textContent = JSON.stringify(named.index);
  document.body.append(idx);
  // Items by name (itemdefs.json: the server's defItems).
  // ... and props by name (propnames.json: the server's defProps).
  const items = paintItemSheet(await (await fetch('itemdefs.json')).json(), await (await fetch('propnames.json')).json());
  out('items', items.sheet);
  const iidx = document.createElement('pre');
  iidx.id = 'itemsIndex';
  iidx.textContent = JSON.stringify(items.index);
  document.body.append(iidx);
  const ppl = document.createElement('pre');
  ppl.id = 'propPeople';
  ppl.textContent = JSON.stringify(items.people);
  document.body.append(ppl);
  const done = document.createElement('pre');
  done.id = 'done';
  document.body.append(done);
</script>
</body>
